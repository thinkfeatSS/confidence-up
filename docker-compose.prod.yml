services:
  # Nginx Gateway & Reverse Proxy (Routes mobile requests to NestJS & FastAPI)
  nginx:
    image: nginx:alpine
    container_name: confidence_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - fastapi
      - api
    restart: always
    networks:
      - confidence_net

  # FastAPI AI Intelligence Engine
  fastapi:
    build:
      context: ./ai-sevices
      dockerfile: Dockerfile
    container_name: confidence_fastapi
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - DATABASE_URL=mysql+aiomysql://u897031851_ismail:Mastsanai110@148.222.53.12:3306/u897031851_confidenceup
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=39xDp8E+RbI5839moflWxbwEZbyK0nm4I+XsGQ6Gmn44
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.2:3b
      - WHISPER_MODEL_SIZE=small
      - WHISPER_DEVICE=cpu
      - WHISPER_COMPUTE_TYPE=int8
    volumes:
      - audio_uploads:/app/uploads
    depends_on:
      - redis
      - ollama
    restart: always
    networks:
      - confidence_net

  # Python AI Background Worker
  worker:
    build:
      context: ./ai-sevices
      dockerfile: Dockerfile
    container_name: confidence_worker
    command: python -m app.workers.task_worker
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=mysql+aiomysql://u897031851_ismail:Mastsanai110@148.222.53.12:3306/u897031851_confidenceup
      - REDIS_URL=redis://redis:6379/0
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.2:3b
      - WHISPER_MODEL_SIZE=small
      - WHISPER_DEVICE=cpu
      - WHISPER_COMPUTE_TYPE=int8
    volumes:
      - audio_uploads:/app/uploads
    depends_on:
      - redis
      - ollama
    restart: always
    networks:
      - confidence_net

  # NestJS Core Backend (Auth, Gamification, Badges, Daily Missions)
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: confidence_nestjs
    env_file:
      - ./api/.env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - APP_URL=https://pink-nightingale-973118.hostingersite.com
      - FRONTEND_URL=https://pink-nightingale-973118.hostingersite.com
      - DATABASE_URL=mysql://u897031851_ismail:Mastsanai110@148.222.53.12:3306/u897031851_confidenceup
      - JWT_SECRET=39xDp8E+RbI5839moflWxbwEZbyK0nm4I+XsGQ6Gmn44
      - JWT_REFRESH_SECRET=A5fvnDAZxMiuFuVBFvMdUKZsCPHkVZiC9jid8lMfcG88
      - JWT_EXPIRES_IN=15m
      - JWT_REFRESH_EXPIRES_IN=7d
      - MAIL_HOST=smtp.hostinger.com
      - MAIL_PORT=465
      - MAIL_SECURE=true
      - MAIL_USER=info@thinkfeat.com
      - MAIL_PASSWORD=c948f8^I
      - MAIL_FROM_NAME=ConfidenceUp
      - MAIL_FROM_ADDRESS=info@thinkfeat.com
      - CRON_SECRET=BIr/MEiDyaIY/D6feYhghZGhL/i+G1rclomzanW4WLcc
    restart: always
    networks:
      - confidence_net

  # Redis Task Queue
  redis:
    image: redis:7-alpine
    container_name: confidence_redis
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - confidence_net

  # Ollama Local LLM Engine
  ollama:
    image: ollama/ollama:latest
    container_name: confidence_ollama
    volumes:
      - ollama_models:/root/.ollama
    restart: always
    networks:
      - confidence_net

networks:
  confidence_net:
    driver: bridge

volumes:
  audio_uploads:
  redis_data:
  ollama_models:
