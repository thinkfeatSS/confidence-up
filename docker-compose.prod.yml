services:
  # Nginx Gateway & Reverse Proxy (SSL termination & API routing)
  nginx:
    image: nginx:alpine
    container_name: confidence_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - fastapi
    restart: always
    networks:
      - confidence_net

  # Certbot Auto SSL Certificate Renewal
  certbot:
    image: certbot/certbot:latest
    container_name: confidence_certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12d & wait $${!}; done;'"
    restart: always
    networks:
      - confidence_net

  # Truefluent AI Unified FastAPI Backend
  fastapi:
    build:
      context: ./ai-sevices
      dockerfile: Dockerfile
    container_name: confidence_fastapi
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - DATABASE_URL=${DATABASE_URL:-mysql+aiomysql://root:mysql_secret@host.docker.internal:3306/truefluent_ai}
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=39xDp8E+RbI5839moflWxbwEZbyK0nm4I+XsGQ6Gmn44
      - JWT_REFRESH_SECRET=A5fvnDAZxMiuFuVBFvMdUKZsCPHkVZiC9jid8lMfcG88
      - JWT_ACCESS_EXPIRES_MINUTES=15
      - JWT_REFRESH_EXPIRES_DAYS=7
      - MAIL_HOST=smtp.hostinger.com
      - MAIL_PORT=465
      - MAIL_SECURE=true
      - MAIL_USER=info@testitan.com
      - MAIL_PASSWORD=Mastsanai110#
      - MAIL_FROM_NAME=Truefluent AI
      - MAIL_FROM_ADDRESS=info@testitan.com
      - APP_URL=https://speakupmic.binaryunit.tech
      - FRONTEND_URL=https://speakupmic.vercel.app
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.2:3b
      - WHISPER_MODEL_SIZE=small
      - WHISPER_DEVICE=cpu
      - WHISPER_COMPUTE_TYPE=int8
    volumes:
      - audio_uploads:/app/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
      - ollama
    restart: always
    networks:
      - confidence_net

  # Truefluent AI Background Audio Processing Worker
  worker:
    build:
      context: ./ai-sevices
      dockerfile: Dockerfile
    container_name: confidence_worker
    command: python -m app.workers.task_worker
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=${DATABASE_URL:-mysql+aiomysql://root:mysql_secret@host.docker.internal:3306/truefluent_ai}
      - REDIS_URL=redis://redis:6379/0
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.2:3b
      - WHISPER_MODEL_SIZE=small
      - WHISPER_DEVICE=cpu
      - WHISPER_COMPUTE_TYPE=int8
    volumes:
      - audio_uploads:/app/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
      - ollama
    restart: always
    networks:
      - confidence_net

  # Redis Task Queue
  redis:
    image: redis:7-alpine
    container_name: confidence_redis
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - confidence_net

  # Ollama Local LLM Engine
  ollama:
    image: ollama/ollama:latest
    container_name: confidence_ollama
    volumes:
      - ollama_models:/root/.ollama
    restart: always
    networks:
      - confidence_net

networks:
  confidence_net:
    driver: bridge

volumes:
  audio_uploads:
  redis_data:
  ollama_models:
