services:
  # Nginx Gateway
  nginx:
    image: nginx:alpine
    container_name: confidence_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - fastapi
    restart: unless-stopped
    networks:
      - confidence_net

  # FastAPI AI Intelligence API
  fastapi:
    build:
      context: ./ai-sevices
      dockerfile: Dockerfile
    container_name: confidence_fastapi
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - DATABASE_URL=mysql+aiomysql://root:mysql_secret@mysql:3306/confidence_builder
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=39xDp8E+RbI5839moflWxbwEZbyK0nm4I+XsGQ6Gmn44
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.2:3b
      - WHISPER_MODEL_SIZE=small
      - WHISPER_DEVICE=cpu
      - WHISPER_COMPUTE_TYPE=int8
    volumes:
      - audio_uploads:/app/uploads
    depends_on:
      - redis
      - mysql
      - ollama
    ports:
      - "8000:8000"
    restart: unless-stopped
    networks:
      - confidence_net

  # AI Background Worker
  worker:
    build:
      context: ./ai-sevices
      dockerfile: Dockerfile
    container_name: confidence_worker
    command: python -m app.workers.task_worker
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=mysql+aiomysql://root:mysql_secret@mysql:3306/confidence_builder
      - REDIS_URL=redis://redis:6379/0
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.2:3b
      - WHISPER_MODEL_SIZE=small
      - WHISPER_DEVICE=cpu
      - WHISPER_COMPUTE_TYPE=int8
    volumes:
      - audio_uploads:/app/uploads
    depends_on:
      - redis
      - mysql
      - ollama
    restart: unless-stopped
    networks:
      - confidence_net

  # Redis Task Queue
  redis:
    image: redis:7-alpine
    container_name: confidence_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - confidence_net

  # MySQL Database (Unified for NestJS API & FastAPI AI Services)
  mysql:
    image: mysql:8.0
    container_name: confidence_mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      - MYSQL_ROOT_PASSWORD=mysql_secret
      - MYSQL_DATABASE=confidence_builder
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    restart: unless-stopped
    networks:
      - confidence_net

  # Ollama Local LLM
  ollama:
    image: ollama/ollama:latest
    container_name: confidence_ollama
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped
    networks:
      - confidence_net

networks:
  confidence_net:
    driver: bridge

volumes:
  audio_uploads:
  redis_data:
  mysql_data:
  ollama_models:
